
on:
  push:
    paths:
      - "smart-contracts/**"
      - "evm-chain/**"
      - "api-gateway/**"
      - "mobile-wallet/**"
      - ".github/workflows/jert-network-ci.yml"
  pull_request:
    paths:
      - "smart-contracts/**"
      - "evm-chain/**"
      - "api-gateway/**"
      - "mobile-wallet/**"
      - ".github/workflows/jert-network-ci.yml"

jobs:
  smart-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps (ci if lock exists)
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Compile
        run: npx hardhat compile

  evm-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect evm-chain package.json
        id: evmchain
        run: |
         if [ -f evm-chain/package.json ]; then
          echo "HAS_NODE=true" >> $GITHUB_OUTPUT
          else
          echo "HAS_NODE=false" >> $GITHUB_OUTPUT
         fi

      - uses: actions/setup-node@v4
        if: steps.evmchain.outputs.HAS_NODE == 'true'
        with:
          node-version: 20

      - name: Install deps
        if: steps.evmchain.outputs.HAS_NODE == 'true'
        working-directory: evm-chain
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build (if defined)
        if: steps.evmchain.outputs.HAS_NODE == 'true'
        working-directory: evm-chain
        run: npm run build || echo "no build"

      - name: Skip (not a Node project)
        if: steps.evmchain.outputs.HAS_NODE != 'true'
        run: echo "evm-chain has no package.json — skipped"

  api-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json OK')"

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Test (if defined)
        run: npm test || echo "no tests"

  mobile-wallet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect Flutter project
        id: flutter_project
        run: |
          if [ -f mobile-wallet/pubspec.yaml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Flutter (pinned)
        if: steps.flutter_project.outputs.present == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.3"
          channel: "stable"
          cache: true

      - name: Check Flutter project
        if: steps.flutter_project.outputs.present == 'true'
        working-directory: mobile-wallet
        run: |
          flutter --version
          flutter pub get
          flutter analyze || true
          flutter test || true

      - name: Skip when the Flutter project is absent
        if: steps.flutter_project.outputs.present != 'true'
        run: echo "mobile-wallet/pubspec.yaml is absent. Flutter checks skipped."
